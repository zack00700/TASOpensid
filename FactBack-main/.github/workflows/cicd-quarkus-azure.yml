name: CI/CD - FactBack -> Azure (OIDC + Managed Identity)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  ci_build_test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The @QuarkusTest suite connects to mongodb://localhost:27017 (see
      # application-test.properties). We run a single-node REPLICA SET rather than
      # Quarkus DevServices/testcontainers (whose Ryuk reaper hangs on this runner)
      # or a standalone service container (which rejects the transactions the
      # @Transactional DAOs open: "Transaction numbers are only allowed on a
      # replica set member"). A replica set supports transactions, matching prod.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary'

      - name: Build & test
        run: ./mvnw -B clean test

      - name: Build Docker image (no push)
        run: docker build -t factback-ci .

  cd_build_push_deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: factback
      GHCR_OWNER: pigch
      GHCR_LOGIN_SERVER: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE=${GHCR_LOGIN_SERVER}/${GHCR_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}
          echo "Building image $FULL_IMAGE"
          docker build -t $FULL_IMAGE -t ${GHCR_LOGIN_SERVER}/${GHCR_OWNER}/${IMAGE_NAME}:latest .
          docker push $FULL_IMAGE
          docker push ${GHCR_LOGIN_SERVER}/${GHCR_OWNER}/${IMAGE_NAME}:latest
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ca-factback \
            --resource-group rg-cont-billing-dev \
            --image ${{ env.FULL_IMAGE }}
