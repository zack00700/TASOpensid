# Test profile — overrides production application.properties for tests

# MongoDB: use an external mongo on localhost:27017 (a service container in CI,
# a local container in dev). DevServices/testcontainers is disabled — its Ryuk
# reaper hangs at startup on some Docker setups and blocked the whole suite.
quarkus.mongodb.devservices.enabled=false
# retryWrites=false: a standalone mongo (dev container / CI service container)
# rejects the txnNumber that retryable writes attach ("Transaction numbers are
# only allowed on a replica set member or mongos"). Matches the %dev profile.
quarkus.mongodb.connection-string=mongodb://localhost:27017/?retryWrites=false
quarkus.mongodb.database=testdb

# Disable Caffeine cache so DAO/REST tests see fresh DB state on every read
quarkus.cache.enabled=false

# Pin timezone so date-window tests are deterministic
app.timezone=Europe/Paris

# Silence the noisy Mongo & Quarkus startup output during tests
quarkus.log.category."org.mongodb".level=WARN
quarkus.log.category."io.quarkus.mongodb".level=WARN
